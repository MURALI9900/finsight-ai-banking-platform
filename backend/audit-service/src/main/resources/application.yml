server:
  port: 8085

spring:
  application:
    name: audit-service
  datasource:
    url: jdbc:postgresql://localhost:5432/finsight
    username: finsight
    password: finsight
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:finsight-audit}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.finsight.audit.event

finsight:
  kafka:
    topic: ${KAFKA_TOPIC:banking.operations.events}
    group-id: ${KAFKA_CONSUMER_GROUP:finsight-audit}
