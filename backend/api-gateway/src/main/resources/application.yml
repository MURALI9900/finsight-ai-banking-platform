server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/auth/**
        - id: banking-operations-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/banking/**,/api/v1/system/**
          filters:
            - JwtGateway
        - id: customer-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/customers/**
          filters:
            - JwtGateway
finsight:
  jwt:
    secret: "FinSightDemoJwtSecretKey-ChangeThisInProduction-2026"
